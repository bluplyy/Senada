name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x ./gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK for Distribution
        run: |
          mkdir -p output
          cp app/build/outputs/apk/release/app-release.apk output/Senada-v1.0.apk
          cp app/build/outputs/apk/release/app-release.apk output/Senada.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Senada-APK
          path: output/Senada.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: ${{ github.ref_name == 'main' && 'v1.0.0' || github.ref_name }}
          name: Senada v1.0.0
          body: |
            ### Senada — Pemutar Musik Lokal Android
            
            Aplikasi pemutar musik lokal Android offline dengan estetika liquid glass & Material 3.
            
            #### 📥 Download Langsung di HP:
            Download file **`Senada.apk`** di bawah ini, buka di HP Android Anda, dan pilih **Install**.
            
            - **Versi:** 1.0 (v1.0.0)
            - **Ukuran:** ~15.5 MB
            - **Target OS:** Android 8.0 (API 26) ke atas (dioptimalkan untuk Android 13/14/15/16)
            - **Fitur:** 100% Offline, MediaStore sync, AndroidX Media3 playback notification, Audio Focus, dan adaptasi warna artwork dinamis.
          files: |
            output/Senada.apk
            output/Senada-v1.0.apk
          draft: false
          prerelease: false
